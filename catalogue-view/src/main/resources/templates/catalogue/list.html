<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>My Blog about Belarus</title>
    <link rel="shortcut icon" th:href="@{/images/favicon.ico}" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}" class="header">
</header>
<main>
<section class="content">
<h1>Let's explore Belarus for yourself</h1>
    <div class="content__wrapper">
        <ul class="content__article-list">
            <li class="content__article-item card" th:each="article: ${articles}">
                <div class="card__wrapper">
                    <img
                            class="card__img"
                            th:src="@{/images/articles/{img}(img=${article.imageName})}"
                            th:alt="${article.imageName}"
                            width="320" height="180"
                    />
                    <p class="card__title" th:text="${article.title}"></p>
                    <p class="card__description" th:text="${article.description}"></p>
                    <p class="card__category" th:text="${article.category}"></p>
                </div>
            </li>
        </ul>
    </div>
</section>
</main>
<footer></footer>
</body>
</html>
